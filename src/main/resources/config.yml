# Skirmish tuning config (hand-edited).
# Map data (spawns, hill points, capture points, boundary) lives in arena.yml,
# set in-game via /arena — do not put map coordinates here.

round:
  duration-minutes: 30
  score-threshold-ends-round: true
  # Countdown after players are placed/geared but before the round timer/scoring starts —
  # keep >= spawn-protection.invulnerability-seconds, or players could start trading damage
  # before the countdown visually ends (a fresh invuln grant still lands exactly when the
  # round goes ACTIVE, but the one granted at placement could expire mid-countdown first).
  warmup-seconds: 10
  # Auto-triggered round starts (boot, vote-sequence finish, a join resuming an idle round)
  # wait for this many online players before cloning a world. /round start (admin) bypasses it.
  min-players-to-start: 1

# Kicks players idle (no movement/interaction/chat) during warmup or between rounds — never
# mid-round, so holding an objective or a defensive position doesn't count as AFK.
afk:
  kick-enabled: true
  timeout-seconds: 120

team:
  imbalance-lock-ratio: 1.5
  swap-incentive-points: 50

spawn-protection:
  invulnerability-seconds: 10
  # Zone protection only applies to gamemodes with FIXED spawns (TDM, KOTH, DOMINATION).
  # FFA / GUN_GAME use random spawns — invulnerability applies, zone radius does not.
  zone-radius-blocks: 32
  zone-no-damage: true
  zone-no-break: true
  zone-no-build: true

points:
  kill: 10
  # No diminishing-returns / repeat-kill / underdog logic by design.
  # Points are per-life scoped and reset on death — that is the anti-snowball mechanism.

death:
  spectator-lock-radius-blocks: 50
  respawn-seconds: 10
  show-death-recap: true   # tells a dying player who killed them and with what (§11 item 4)
  # A dying player watches their killer (chase-cam) instead of being locked to the death spot,
  # when the killer's known and still online. Falls back to the locked-sphere behavior otherwise.
  follow-killer-enabled: true

kill-feed:
  enabled: true
  # Broadcast to everyone on every kill (§11 item 3). The per-killer "+N pts" actionbar
  # (points.kill) is separate and stays even if this is off.

killstreaks:
  enabled: true
  bonus-points-enabled: false   # per-life points are already a snowball risk — off by default
  bonus-points-per-threshold: 5
  # Kills within this many seconds of each other count as one multi-kill (Double Kill, Triple
  # Kill, ...) — a separate callout from the per-life streak thresholds below.
  multikill-window-seconds: 4
  # Streak length -> callout name, broadcast to everyone when a player reaches it.
  thresholds:
    3: "Killing Spree"
    5: "Rampage"
    7: "Dominating"
    10: "Unstoppable"

scoreboard:
  enabled: true
  update-interval-ticks: 20

end-round:
  free-roam-spectator: true
  winner-announcement-seconds: 5
  next-round-countdown-seconds: 15

vote:
  enabled-gamemodes: [KOTH, DOMINATION, TDM, FFA, GUN_GAME]

gamemode:
  koth:
    loadouts-enabled: true
  domination:
    loadouts-enabled: true
  tdm:
    loadouts-enabled: true
  ffa:
    loadouts-enabled: true
  gun_game:
    loadouts-enabled: false

koth:
  capture-radius-blocks: 8
  points-per-second: 1
  score-threshold: 300
  particle-ring: DUST

domination:
  capture-point-count: 3
  capture-radius-blocks: 6
  points-per-tick-per-zone: 1
  tick-interval-seconds: 1
  score-threshold: 300
  particle-beam: DUST
  beam-height: 20

tdm:
  score-threshold: 75

ffa:
  score-threshold: 30
  min-spawn-distance-from-players: 15

gungame:
  score-threshold-is-tier-completion: true
  # Each entry is a WeaponMechanics weapon title (the top-level key of a WM weapon .yml),
  # generated directly via WeaponMechanicsAPI.generateWeapon — Gun Game has no loadout shop,
  # so this bypasses loadout-catalog.yml entirely. The LAST entry is always the knife tier.
  weapon-ladder:
    - Uzi
    - "357_Magnum"
    - Origin_12
    - AK_47
    - Kar98k
    - MG34
    - Combat_Knife
  demote-on-knife-death: true
  final-knife-kill-wins-instantly: true

loadout:
  starting-points: 0

kits:
  max-saved-presets: 5

arena-border:
  enabled: true
  material: RED_STAINED_GLASS
  render-distance: 24       # blocks from a boundary edge before its wall becomes visible
  wall-half-width: 10       # the visible wall patch extends this far each way along the edge
  wall-half-height: 6       # and this far up/down from the player
  enforce-margin: 2         # blocks past the boundary allowed before movement is blocked outright
                            # (backstop only — the solid-looking wall is what actually stops most players)
  tick-interval-ticks: 10   # how often each player's nearby wall is recalculated

discord:
  enabled: false
