name: Skirmish
version: '1'
main: org.flintstqne.skirmish.Skirmish
api-version: '1.21'
# InventoryFramework is shaded and relocated into this jar (see pom.xml), so it must NOT be
# declared here — requiring the standalone IF plugin would block enabling for no reason.
depend: [WeaponMechanics]

commands:
  loadout:
    description: Open the loadout builder (blocked in gamemodes without loadouts)
    usage: /loadout
  loadouts:
    description: Open your saved loadout presets ("My Loadouts")
    usage: /loadouts
  team:
    description: Join a team, or view team status and the swap incentive
    usage: /team
  arena:
    description: Arena map-data setup (spawns, hill points, capture points, boundary)
    usage: /arena <set|add> <spawn|boundary|world|ffaspawn|hillpoint|capturepoint> [args]
    permission: skirmish.admin
  round:
    description: Manually start or end a round, overriding the vote-driven flow
    usage: /round <start <mode>|end|status>
    permission: skirmish.admin
  admin:
    description: Admin debug tools (points economy, config reload, round diagnostics, stats reset)
    usage: /admin <points <set|get> <player> [amount]|stats reset <player|all>|reload|diagnostics>
    permission: skirmish.admin
  stats:
    description: Show lifetime stats for yourself or another player
    usage: /stats [player]
  leaderboard:
    description: Show the top players in a stat category
    usage: /leaderboard <kills|deaths|knife_kills|objective_points|rounds_played|rounds_won>
  history:
    description: Show the server's most recent rounds
    usage: /history [count]

permissions:
  skirmish.admin:
    description: Access to Skirmish admin commands
    default: op
